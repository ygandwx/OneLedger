services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ledger_data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?请设置域名}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  ledger_data:
  caddy_data:
  caddy_config:
